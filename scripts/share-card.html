<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}body{background:#080f17;color:#eaf3f7;font-family:Arial,Helvetica,sans-serif}.card{width:1200px;height:630px;padding:44px 56px;display:grid;grid-template-columns:1fr 360px;gap:38px;background:radial-gradient(ellipse at 85% 50%,#0e3650,transparent 62%)}.copy{display:flex;flex-direction:column;justify-content:space-between;padding:8px 0}.logo{font-size:44px;letter-spacing:-3px;font-weight:900}.eyebrow{font-size:13px;letter-spacing:5px;color:#85bfd3;margin-bottom:22px}h1{font-size:80px;letter-spacing:-5px;line-height:1;margin:0 0 30px;font-weight:900}.soon{display:inline-block;border:1px solid #3e829a;color:#76def3;padding:14px 22px;font-size:20px;font-weight:bold;letter-spacing:7px;background:#102c3c}.foot{font-size:17px;color:#b5c9d6}.foot strong{display:block;color:#79d6ea;margin-top:14px;font-size:20px;font-weight:normal}.art{display:flex;align-items:center;justify-content:center}.art img{width:360px;height:525px;object-fit:contain;filter:drop-shadow(0 15px 25px #0008)}</style></head><body><main class="card"><div class="copy"><div class="logo">SISLOP</div><div><div class="eyebrow">O PRÓXIMO CAPÍTULO</div><h1>DIAMANTADO</h1><div class="soon">EM BREVE</div></div><div class="foot">Shows, novidades e contato<strong>sislop.com.br</strong></div></div><div class="art"><img src="__ALBUM_ART__" alt="Arte do álbum DIAMANTADO"></div></main></body></html>
